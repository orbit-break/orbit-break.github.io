  <title
     id="title1">Orbit Break — Neon Observatory app icon</title>
  <desc
     id="desc1">Amber Comet launching tangentially from a cyan planet orbit on a flat navy background.</desc>
  <!-- Full-bleed opaque canvas; platform launchers apply their own masks. -->
  <!-- Ship nose follows the clockwise tangent at the upper-right orbit. -->
